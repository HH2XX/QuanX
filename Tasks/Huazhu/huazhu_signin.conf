# 华住会每日签到（Quantumult X）
# 合并下面三段到现有配置，不要重复创建同名段落。
# 开启重写和 MitM 后，打开华住会 App/微信小程序签到页。
# 收到“Token获取成功”通知后关闭抓取规则，保留定时任务并手动运行一次验证。
# 若 App 的证书校验导致抓取失败，请尝试微信“华住会”小程序签到页。

[rewrite_local]
^https:\/\/appgw\.huazhu\.com\/game\/(?:sign_header|sign_in)(?:\?.*)?$ url script-request-header https://raw.githubusercontent.com/d539834401/QxSignUp/main/huazhu_signin.js
^https:\/\/hweb-personalcenter\.huazhu\.com\/login\/autoLogin(?:\?.*)?$ url script-request-header https://raw.githubusercontent.com/d539834401/QxSignUp/main/huazhu_signin.js

[task_local]
5 9 * * * https://raw.githubusercontent.com/d539834401/QxSignUp/main/huazhu_signin.js, tag=华住会签到, enabled=true

[mitm]
hostname = %APPEND% appgw.huazhu.com hweb-personalcenter.huazhu.com
