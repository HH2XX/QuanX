[rewrite_local]
# 获取 QQ 音乐签到参数
^http:\/\/u6\.y\.qq\.com\/cgi-bin\/musicu\.fcg url script-request-header https://raw.githubusercontent.com/HH2XX/QuanX/refs/heads/main/Tasks/QQMusic/QQMusic.js
^https:\/\/u6\.y\.qq\.com\/cgi-bin\/musics\.fcg\?_webcgikey=EveryDaySignLvzScore&_=[0-9]+&sign=\w+ url script-request-body https://raw.githubusercontent.com/HH2XX/QuanX/refs/heads/main/Tasks/QQMusic/QQMusic.js

[task_local]
