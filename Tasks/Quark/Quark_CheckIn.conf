#!name=夸克网盘每日签到
#!desc=自动获取夸克网盘 Cookie 并每日签到
#!icon=https://raw.githubusercontent.com/HH2XX/QuanX/refs/heads/main/icon/Quark.png

[rewrite_local]
# 获取夸克网盘 Cookie
^https:\/\/drive(-h|-m)?\.quark\.cn\/1\/clouddrive\/ url script-request-header https://raw.githubusercontent.com/HH2XX/QuanX/refs/heads/main/Tasks/Quark/Quark_CheckIn.js

[task_local]
0 9 * * * https://raw.githubusercontent.com/HH2XX/QuanX/refs/heads/main/Tasks/Quark/Quark_CheckIn.js, tag=夸克网盘签到, enabled=true

[mitm]
hostname = drive.quark.cn, drive-h.quark.cn, drive-m.quark.cn
