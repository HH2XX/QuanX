# 微博 App · 超话每日签到（Quantumult X）
#
# 仅保留新版 flowlist 关注列表与 active_checkin 签到请求。
# 开启重写后，在微博 App 中依次进入“我的 → 超话社区 → 我的 → 关注”，
# 再进入任意超话手动签到一次；收到两条捕获成功通知后关闭重写。

[rewrite_local]
# 新版关注列表的标识在 POST body 中，必须读取请求体。
^https?:\/\/m?api\.weibo\.c(n|om)\/2\/flowlist(?:[\/?].*)?$ url script-request-body https://raw.githubusercontent.com/d539834401/QxSignUp/main/weibo_wuwa_supertopic_signin.js
^https?:\/\/m?api\.weibo\.c(n|om)\/2\/page\/button.*active(?:_|%5f)checkin url script-request-header https://raw.githubusercontent.com/d539834401/QxSignUp/main/weibo_wuwa_supertopic_signin.js

[task_local]
0 8 * * * https://raw.githubusercontent.com/d539834401/QxSignUp/main/weibo_wuwa_supertopic_signin.js, tag=微博·超话签到, enabled=true

[mitm]
hostname = %APPEND% api.weibo.cn, mapi.weibo.com
