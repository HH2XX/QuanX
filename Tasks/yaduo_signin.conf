# 亚朵酒店 App 每日签到与抽奖（Quantumult X）
#
# 将下面三段合并到正在使用的 Quantumult X 配置文件。
# 首次使用时保持请求参数抓取规则开启，打开亚朵 App 的“我的 → 积分/签到”并手动进入一次。
# 收到“Token获取成功”通知后，关闭该重写规则，仅保留定时任务。

[rewrite_local]
^https:\/\/miniapp\.yaduo\.com\/atourlife\/signIn\/signIn.+ url script-request-header https://raw.githubusercontent.com/d539834401/QxSignUp/main/yaduo_signin.js

[task_local]
8 8 * * * https://raw.githubusercontent.com/d539834401/QxSignUp/main/yaduo_signin.js, tag=亚朵酒店签到, enabled=true

[mitm]
hostname = %APPEND% miniapp.yaduo.com
